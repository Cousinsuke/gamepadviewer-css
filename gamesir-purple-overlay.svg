-30 51.96 M270 649.81h60m-60 0 30 51.96m-30-51.96-30 51.96 M-120 701.77h60m-60 0 30 51.96m-30-51.96-30 51.96 M-60 701.77h60m-60 0 30 51.96m-30-51.96-30 51.96 M0 701.77h60m-60 0 30 51.96m-30-51.96-30 51.96 M60 701.77h60m-60 0 30 51.96m-30-51.96-30 51.96 M120 701.77h60m-60 0 30 51.96m-30-51.96-30 51.96 M180 701.77h60m-60 0 30 51.96m-30-51.96-30 51.96 M240 701.77h60m-60 0 30 51.96m-30-51.96-30 51.96" stroke="#7c3aed" stroke-width="1.25"/>
    <path d="M0 390 -60 493.92 H60Z M60 493.92 0 597.85 H120Z M0 597.85 -60 701.77 H60Z"
          stroke="#9860ed" stroke-width="1.65" opacity=".62"/>
  </g>
  </g>
  <!-- The right grip follows the photo's smoky diagonal insert and dark
       elongated polygon details; all artwork stays inside the removable grip. -->
  <g clip-path="url(#right-grip)">
    <path d="M661 264 697 305 741 487 686 593 651 536 620 438 565 417Z" fill="url(#right-smoke)"/>
    <path d="M650 283 673 298 714 481 684 553 656 447 587 397Z" fill="url(#right-shine)"/>
    <path d="M677 335 Q680 329 684 335 L707 400 Q709 407 705 413 L693 431 Q689 437 685 430 L662 367 Q660 361 664 356Z"
          fill="#0e1016" opacity=".84"/>
    <path d="M649 397 662 411 664 438 656 448 644 417Z" fill="#101218" opacity=".79"/>
    <path d="M687 315 695 329 704 360 698 370 689 346Z" fill="#1a1d24" opacity=".65"/>
  </g>
</svg>
