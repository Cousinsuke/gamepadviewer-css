<svg xmlns="http://www.w3.org/2000/svg" width="750" height="630" viewBox="0 0 750 630">
  <defs>
    <!-- Paint reference: two diagonals meet the bottom edge of the faceplate.
         Its top follows the stock shell BELOW the grey shoulder/Home section. -->
    <clipPath id="faceplate">
      <path d="M80 247 Q91 207 107 196 C141 178 207 157 226 162 C250 167 290 242 315 242 H436 C460 242 500 168 525 162 C545 158 609 178 643 196 Q660 209 670 247 L520 501 H230Z"/>
    </clipPath>
    <mask id="control-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="750" height="630">
      <rect width="750" height="630" fill="white"/>
      <!-- Expose the unmodified black + and the original stick wells/menu keys. -->
      <circle cx="277.67" cy="401.49" r="62" fill="black"/>
      <circle cx="185.47" cy="283.8" r="69" fill="black"/>
      <circle cx="473" cy="397.78" r="69" fill="black"/>
      <circle cx="322.12" cy="280.37" r="20" fill="black"/>
      <circle cx="430.13" cy="280.37" r="20" fill="black"/>
    </mask>
    <linearGradient id="smoked-polycarbonate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#88909b" stop-opacity=".25"/>
      <stop offset=".35" stop-color="#565b67" stop-opacity=".31"/>
      <stop offset=".7" stop-color="#323640" stop-opacity=".29"/>
      <stop offset="1" stop-color="#1b1e26" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="soft-reflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c1c7cf" stop-opacity=".15"/>
      <stop offset="1" stop-color="#939baa" stop-opacity=".025"/>
    </linearGradient>
    <clipPath id="left-grip">
      <path d="M80 247 L230 501 C180 511 106 624 76.67 630 C41 625 2 600 .09 529 C-2 467 26 366 80 247Z"/>
    </clipPath>
    <clipPath id="right-grip">
      <path d="M670 247 L520 501 C570 511 644 624 673.33 630 C709 625 748 600 749.91 529 C752 467 724 366 670 247Z"/>
    </clipPath>
    <linearGradient id="mesh-fade" gradientUnits="userSpaceOnUse" x1="14" y1="545" x2="150" y2="425">
      <stop offset="0" stop-color="white" stop-opacity=".95"/>
      <stop offset=".36" stop-color="white" stop-opacity=".8"/>
      <stop offset=".72" stop-color="white" stop-opacity=".27"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="mesh-into-black" maskUnits="userSpaceOnUse" x="0" y="240" width="235" height="395">
      <rect x="0" y="240" width="235" height="395" fill="url(#mesh-fade)"/>
    </mask>
    <linearGradient id="mesh-top-fade" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="485">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="mesh-soft-top" maskUnits="userSpaceOnUse" x="0" y="240" width="235" height="395">
      <rect x="0" y="240" width="235" height="395" fill="url(#mesh-top-fade)"/>
    </mask>
    <linearGradient id="right-smoke" gradientUnits="userSpaceOnUse" x1="604" y1="312" x2="724" y2="590">
      <stop offset="0" stop-color="#757982" stop-opacity=".66"/>
      <stop offset=".38" stop-color="#565b65" stop-opacity=".64"/>
      <stop offset=".7" stop-color="#363a43" stop-opacity=".38"/>
      <stop offset="1" stop-color="#17191f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="right-shine" gradientUnits="userSpaceOnUse" x1="602" y1="322" x2="703" y2="495">
      <stop offset="0" stop-color="#c1c6d0" stop-opacity=".16"/>
      <stop offset=".6" stop-color="#737986" stop-opacity=".07"/>
      <stop offset="1" stop-color="#4c5260" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#faceplate)" mask="url(#control-cutouts)">
    <rect x="70" y="155" width="610" height="347" fill="url(#smoked-polycarbonate)"/>
    <!-- Subtle internal reflections, all hard-clipped at plate boundaries.
         No stroked perimeter, white guide lines, logos, or fasteners. -->
    <path d="M136 158 H294 L462 502 H286Z" fill="url(#soft-reflection)"/>
    <path d="M308 159 H350 L523 502 H488Z" fill="#a0a8b6" opacity=".035"/>
    <path d="M99 196 L241 501 H278 L145 196Z" fill="#0a0b10" opacity=".14"/>
    <path d="M640 206 L490 501 H450 L598 206Z" fill="#090b10" opacity=".17"/>
  </g>
  <!-- Each large triangle is divided into four smaller triangles. All vertices
       share a regular lattice, so neighbouring triangles meet cleanly at points. -->
  <g clip-path="url(#left-grip)" mask="url(#mesh-soft-top)">
  <g mask="url(#mesh-into-black)" fill="none" stroke-linejoin="round">
