<svg xmlns="http://www.w3.org/2000/svg" width="750" height="630" viewBox="0 0 750 630">
  <defs>
    <!-- Paint reference: two diagonals meet the bottom edge of the faceplate.
         Its top follows the stock shell BELOW the grey shoulder/Home section. -->
    <clipPath id="faceplate">
      <path d="M80 247 Q91 207 107 196 C141 178 207 157 226 162 C250 167 290 242 315 242 H436 C460 242 500 168 525 162 C545 158 609 178 643 196 Q660 209 670 247 L520 501 H230Z"/>
    </clipPath>
    <mask id="control-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="750" height="630">
      <rect width="750" height="630" fill="white"/>
      <!-- Expose the unmodified black + and the original stick wells/menu keys. -->
      <circle cx="277.67" cy="401.49" r="62" fill="black"/>
      <circle cx="185.47" cy="283.8" r="69" fill="black"/>
      <circle cx="473" cy="397.78" r="69" fill="black"/>
      <circle cx="322.12" cy="280.37" r="20" fill="black"/>
      <circle cx="430.13" cy="280.37" r="20" fill="black"/>
    </mask>
    <linearGradient id="smoked-polycarbonate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#88909b" stop-opacity=".25"/>
      <stop offset=".35" stop-color="#565b67" stop-opacity=".31"/>
      <stop offset=".7" stop-color="#323640" stop-opacity=".29"/>
      <stop offset="1" stop-color="#1b1e26" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="soft-reflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c1c7cf" stop-opacity=".15"/>
      <stop offset="1" stop-color="#939baa" stop-opacity=".025"/>
    </linearGradient>
    <!-- Only the lower left removable grip receives the geometric pattern. -->
    <clipPath id="left-grip">
      <path d="M17 420 L158 552 C127 586 96 622 76.67 630 C41 625 2 600 .09 529 Q-1 482 17 420Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#faceplate)" mask="url(#control-cutouts)">
    <rect x="70" y="155" width="610" height="347" fill="url(#smoked-polycarbonate)"/>
    <!-- Subtle internal reflections, all hard-clipped at plate boundaries.
         No stroked perimeter, white guide lines, logos, or fasteners. -->
    <path d="M136 158 H294 L462 502 H286Z" fill="url(#soft-reflection)"/>
    <path d="M308 159 H350 L523 502 H488Z" fill="#a0a8b6" opacity=".035"/>
    <path d="M99 196 L241 501 H278 L145 196Z" fill="#0a0b10" opacity=".14"/>
    <path d="M640 206 L490 501 H450 L598 206Z" fill="#090b10" opacity=".17"/>
  </g>
  <g clip-path="url(#left-grip)" fill="none" stroke="#6d28d9" stroke-width="1.15" opacity=".87">
    <path d="M-8 404 36 434 79 474 120 515 162 553
             M-8 461 30 448 66 484 111 493
             M-5 500 22 472 58 502 96 511 137 529
             M4 552 49 531 92 572 120 515
             M26 600 49 531 58 502 79 474
             M70 641 92 572 137 529
             M-8 404 22 472 36 434 66 484 30 448 -5 500
             M22 472 66 484 58 502 -5 500
             M49 531 22 472 M92 572 162 553"/>
  </g>
</svg>
