<svg xmlns="http://www.w3.org/2000/svg" width="750" height="630" viewBox="0 0 750 630">
  <defs>
    <clipPath id="controller-shape">
      <path d="M664.37 214c-6.72-16.68-20.54-20.88-21.82-22-11.7-10.34-2.47-21.22-19.95-30.7-18.28-9.91-72-37-114.22-31.37-9.22 1.23-27.83 17.6-41.21 17.6H282.84c-13.38 0-32-16.37-41.22-17.6-42.24-5.63-95.93 21.46-114.22 31.37-17.47 9.48-8.24 20.36-19.94 30.7-1.28 1.12-15.1 5.32-21.82 22C22.89 370-1.74 469.11.09 529.13 3 623.55 76.67 630.46 76.67 630.46c37-8.62 111.55-129.14 168.54-129.14H504.8c57 0 131.5 120.52 168.54 129.14 0 0 73.68-6.91 76.56-101.33C751.77 469.11 727.09 370 664.37 214Z"/>
    </clipPath>

    <linearGradient id="panel-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7d9de" stop-opacity=".82"/>
      <stop offset=".33" stop-color="#6f737d" stop-opacity=".78"/>
      <stop offset=".68" stop-color="#252830" stop-opacity=".9"/>
      <stop offset="1" stop-color="#090a0e" stop-opacity=".96"/>
    </linearGradient>

    <linearGradient id="panel-mid" x1="0" y1=".15" x2="1" y2=".85">
      <stop offset="0" stop-color="#767b85" stop-opacity=".78"/>
      <stop offset=".5" stop-color="#2c2f37" stop-opacity=".9"/>
      <stop offset="1" stop-color="#111217" stop-opacity=".96"/>
    </linearGradient>

    <linearGradient id="panel-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2e35" stop-opacity=".9"/>
      <stop offset="1" stop-color="#07080b" stop-opacity=".98"/>
    </linearGradient>

    <radialGradient id="chrome" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#e7e9ed"/>
      <stop offset=".52" stop-color="#a8abb2"/>
      <stop offset=".75" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#626670"/>
    </radialGradient>

    <linearGradient id="purple-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".25" stop-color="#7c3aed"/>
      <stop offset=".62" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>

    <pattern id="purple-wire" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M0 72 36 0 72 72M0 36h72M0 72 72 36M0 0l72 36" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity=".9"/>
      <path d="M36 0 0 36M36 0l36 36" fill="none" stroke="#c4b5fd" stroke-width=".65" opacity=".55"/>
    </pattern>

    <filter id="soft-purple-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#controller-shape)">
    <!-- GameSir-inspired angular chassis panels. -->
    <path d="M75 248 229 154 361 242 278 501 134 499 58 403Z" fill="url(#panel-light)" opacity=".86"/>
    <path d="M226 154 375 147 361 242 278 501 207 438Z" fill="url(#panel-mid)" opacity=".88"/>
    <path d="M375 147 520 153 681 255 621 425 511 501 361 242Z" fill="url(#panel-dark)" opacity=".88"/>
    <path d="M361 242 520 153 604 209 490 474 278 501Z" fill="url(#panel-mid)" opacity=".66"/>
    <path d="M91 315 226 154 275 187 159 387Z" fill="#edf0f5" opacity=".2"/>
    <path d="M489 474 621 425 589 510 506 501Z" fill="#aeb2ba" opacity=".2"/>

    <!-- Crisp diagonal seams echo the transparent angular shell. -->
    <g fill="none" stroke-linecap="round">
      <path d="M76 248 229 154 361 242 278 501" stroke="#e5e7eb" stroke-width="2.2" opacity=".5"/>
      <path d="M361 242 520 153 681 255" stroke="#757a86" stroke-width="2" opacity=".48"/>
      <path d="M159 387 278 501 489 474 604 209" stroke="#0a0b0f" stroke-width="5" opacity=".55"/>
      <path d="M160 391 278 496 486 470" stroke="#c4b5fd" stroke-width="1" opacity=".32"/>
    </g>

    <!-- Purple geometric grip pattern: replaces the reference controller's orange. -->
    <path d="M0 335 80 278 168 393 129 574 66 630 0 596Z" fill="url(#purple-wire)" opacity=".88"/>
    <path d="M586 376 690 287 750 345 750 618 684 630 621 554Z" fill="url(#panel-dark)" opacity=".68"/>
    <path d="M639 398 700 337 728 392 704 484 661 472Z" fill="#575b66" opacity=".34"/>

    <!-- Purple accent seams. -->
    <path d="M16 420 112 330M7 476 144 365M4 538 133 438" stroke="#7c3aed" stroke-width="2" opacity=".74" filter="url(#soft-purple-glow)"/>

    <!-- Chrome circular D-pad plate, matching the GameSir reference. -->
    <circle cx="278" cy="401" r="58" fill="#07080a" opacity=".82"/>
    <circle cx="278" cy="401" r="54" fill="url(#chrome)" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="278" cy="401" r="48" fill="none" stroke="#747983" stroke-width="1.4" opacity=".82"/>
    <path d="M278 354v94M231 401h94" stroke="#7c818b" stroke-width="1.4" opacity=".38"/>
    <path d="M244 367c19-16 50-20 72-4" fill="none" stroke="#fff" stroke-width="2.3" opacity=".55"/>

    <!-- Small metallic fastener details. -->
    <g fill="url(#chrome)" stroke="#42454d" stroke-width="1.2" opacity=".82">
      <circle cx="128" cy="337" r="7"/>
      <circle cx="173" cy="470" r="7"/>
      <circle cx="586" cy="336" r="7"/>
      <circle cx="540" cy="474" r="7"/>
    </g>
    <g stroke="#555a64" stroke-width="1">
      <path d="M124 337h8M128 333v8M169 470h8M173 466v8M582 336h8M586 332v8M536 474h8M540 470v8"/>
    </g>

    <!-- Branding details inspired by the photographed GameSir controller. -->
    <text x="375" y="487" text-anchor="middle" fill="#d8dbe2" opacity=".82" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.2">GAMESIR</text>
    <text x="509" y="375" text-anchor="middle" fill="#bfc3cc" opacity=".62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" transform="rotate(-57 509 375)">G7 PRO</text>

    <!-- Fine purple edge accents around the central panel. -->
    <path d="M278 501h211" stroke="url(#purple-metal)" stroke-width="2.2" opacity=".7"/>
    <path d="M229 154 361 242 520 153" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity=".34"/>
  </g>
</svg>
